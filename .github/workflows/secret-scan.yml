name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for leaked credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog (verified credentials only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
